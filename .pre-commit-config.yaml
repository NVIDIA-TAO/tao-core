default_install_hook_types:
- pre-commit
- pre-push
repos:
- repo: local
  hooks:
  - id: license-header
    name: license header
    description: Every source file must carry an SPDX license header.
    entry: python3 .github/hooks/check_license_header.py
    language: system
    files: \.(py|sh)$
    stages:
    - pre-push
  - id: pylint
    name: pylint
    description: Static analysis, configured by .pylintrc.
    entry: pylint --rcfile .pylintrc
    language: system
    types:
    - python
    files: ^(nvidia_tao_core/)
    stages:
    - pre-push
  - id: pydocstyle
    name: pydocstyle
    description: Docstring conventions.
    entry: pydocstyle --ignore=D400,D213,D203,D211,D4
    language: system
    types:
    - python
    files: ^(nvidia_tao_core/)
    stages:
    - pre-push
  - id: flake8
    name: flake8
    description: Style and lint checks.
    entry: flake8 --ignore=E24,W504 --max-line-length=120
    language: system
    types:
    - python
    files: ^(nvidia_tao_core/)
    stages:
    - pre-push
