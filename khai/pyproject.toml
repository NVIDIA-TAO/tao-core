[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khai"
version = "0.0.1"
description = "Placeholder package for the KHAI CI pipeline test."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
op = ["PyYAML>=6"]
apps = ["PyYAML>=6"]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.setuptools]
packages = ["khai", "khai.core", "khai.core.cv", "khai.core.cv.schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
