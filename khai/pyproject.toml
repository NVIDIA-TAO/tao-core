[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khai"
dynamic = ["version"]
description = "Placeholder package for the KHAI CI pipeline test."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
op = ["PyYAML>=6"]
apps = ["PyYAML>=6"]

[dependency-groups]
dev = ["pytest==8.3.4"]

# This folder is the `khai` package itself.
[tool.setuptools]
package-dir = { "khai" = "." }
packages = ["khai", "khai.core", "khai.core.cv", "khai.core.cv.schema"]

[tool.setuptools.dynamic]
version = { attr = "khai.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
